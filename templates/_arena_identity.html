{% macro arena_identity(player) -%}
<div class="ga-mini-card" data-arena-card="{{ player.cosmetic_card or '' }}"><div class="ga-mini-identity"><span class="ga-avatar {{ ('ga-master-frame' if player.profile_frame else '') ~ (' ga-shop-frame' if player.cosmetic_frame else '') }}" data-frame="{{ player.profile_frame }}" aria-hidden="true">{{ player.username[:1]|upper }}</span><a href="{{ url_for('public_profile',user_id=player.id) }}"><strong class="ga-cosmetic-name" data-arena-nameplate="{{ player.cosmetic_nameplate or '' }}">{{ player.username }}</strong></a></div></div>
{%- endmacro %}
