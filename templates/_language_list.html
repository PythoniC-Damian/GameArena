<label>{{ t('Search languages') }}<input type="search" class="ga-language-search" data-language-search placeholder="{{ t('Search languages') }}"></label><form method="post" action="{{ url_for('i18n.choose') }}" data-language-list><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="next" value="{{ request.path }}"><div class="ga-language-list">{% for code,name in languages.items() %}<label class="ga-language-row" data-language-name="{{ name }} {{ language_names_en[code] }}"><input type="radio" name="language" value="{{ code }}" {% if code==current_language %}checked{% endif %} required><span><strong lang="{{ code }}" dir="auto">{{ name }}</strong><small lang="en" dir="ltr">{{ language_names_en[code] }}</small></span></label>{% endfor %}</div><noscript><button class="ga-button">{{ t('Save language') }}</button></noscript></form><p data-language-empty hidden>{{ t('No languages found.') }}</p>
