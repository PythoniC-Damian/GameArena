{% if draft.artwork %}<div class="ga-card-carousel ga-organizer-artwork" data-carousel data-interval="6000" aria-label="{{ draft.name }} · {{ t('Tournament images') }}">{% for image in draft.artwork %}<img class="ga-card-image ga-slide{{ ' is-active' if loop.first else '' }}" {% if loop.first %}src{% else %}data-src{% endif %}="{{ url_for('organizers.artwork', image_id=image.id) }}" alt="{{ draft.name }} · {{ t('Image') }} {{ loop.index }}" width="1280" height="720" loading="lazy" decoding="async">{% endfor %}</div>{% endif %}
