{% macro switch(name,label,checked,description='',value='on') -%}<label class="ga-switch-row"><span><strong>{{ t(label) }}</strong>{% if description %}<small>{{ t(description) }}</small>{% endif %}</span><span class="ga-switch-control"><input type="checkbox" role="switch" name="{{ name }}" value="{{ value }}" aria-label="{{ t(label) }}" {% if checked %}checked{% endif %}><span class="ga-switch-track" aria-hidden="true"></span></span></label>{%- endmacro %}
