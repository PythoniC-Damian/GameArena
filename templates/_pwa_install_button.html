<!-- PWA Install App button + iOS instructions (appears on all device sizes) -->
<div id="pwaInstallContainer" class="fixed bottom-20 right-4 z-50 hidden md:bottom-6">
  <button id="pwaInstallBtn" class="flex items-center gap-2 rounded-full bg-emerald-500 px-5 py-3 text-sm font-semibold text-slate-950 shadow-2xl shadow-emerald-500/30 transition hover:bg-emerald-400">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>
    Install App
  </button>
</div>

<!-- iOS Add to Home Screen instructions modal -->
<div id="pwaIosModal" class="fixed inset-0 z-[60] hidden items-end justify-center bg-slate-950/70 p-4 backdrop-blur-sm md:items-center">
  <div class="w-full max-w-sm rounded-[32px] border border-slate-700 bg-slate-900 p-6 text-white shadow-2xl">
    <div class="flex items-start justify-between">
      <div>
        <p class="text-sm uppercase tracking-[0.3em] text-emerald-300">Install GameArena</p>
        <h3 class="mt-2 text-xl font-bold">Add to Home Screen</h3>
      </div>
      <button id="pwaIosClose" class="rounded-full bg-slate-800 p-2 text-slate-300 hover:text-white" aria-label="Close">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <ol class="mt-5 space-y-4 text-sm text-slate-300">
      <li class="flex gap-3">
        <span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-emerald-500/20 font-bold text-emerald-300">1</span>
        <span>Tap the <strong class="text-white">Share</strong> button in your browser toolbar (the square with an up arrow).</span>
      </li>
      <li class="flex gap-3">
        <span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-emerald-500/20 font-bold text-emerald-300">2</span>
        <span>Scroll and tap <strong class="text-white">"Add to Home Screen"</strong>.</span>
      </li>
      <li class="flex gap-3">
        <span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-emerald-500/20 font-bold text-emerald-300">3</span>
        <span>Tap <strong class="text-white">Add</strong> in the top-right corner.</span>
      </li>
    </ol>
    <button id="pwaIosGotIt" class="mt-6 w-full rounded-full bg-emerald-500 py-3 text-sm font-semibold text-slate-950 hover:bg-emerald-400">Got it</button>
  </div>
</div>

<script>
(function () {
  var deferredPrompt = null;
  var container = document.getElementById('pwaInstallContainer');
  var btn = document.getElementById('pwaInstallBtn');
  var iosModal = document.getElementById('pwaIosModal');
  var isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
  var isStandalone = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches;

  // If already installed (running as a standalone app), don't show the button.
  if (isStandalone) {
    if (container) container.classList.add('hidden');
    return;
  }

  // Show the button on Android Chrome when the install prompt fires.
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredPrompt = e;
    if (container) container.classList.remove('hidden');
  });

  // On iOS, no beforeinstallprompt fires. Show the button (with a slight delay
  // so it doesn't flash before the page settles) and open instructions on tap.
  if (isIos) {
    setTimeout(function () {
      if (container) container.classList.remove('hidden');
    }, 1500);
  }

  function openIosModal() {
    if (iosModal) {
      iosModal.classList.remove('hidden');
      iosModal.classList.add('flex');
    }
  }
  function closeIosModal() {
    if (iosModal) {
      iosModal.classList.add('hidden');
      iosModal.classList.remove('flex');
    }
  }

  if (btn) {
    btn.addEventListener('click', function () {
      if (isIos) {
        openIosModal();
        return;
      }
      if (!deferredPrompt) {
        // Fallback: guide user to browser's Add to Home Screen.
        alert('Tap your browser menu (⋮ or Share) and choose "Add to Home Screen" / "Install App".');
        return;
      }
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function (choiceResult) {
        if (choiceResult.outcome === 'accepted') {
          if (container) container.classList.add('hidden');
        }
        deferredPrompt = null;
      });
    });
  }

  var iosClose = document.getElementById('pwaIosClose');
  var iosGotIt = document.getElementById('pwaIosGotIt');
  if (iosClose) iosClose.addEventListener('click', closeIosModal);
  if (iosGotIt) iosGotIt.addEventListener('click', closeIosModal);
  if (iosModal) iosModal.addEventListener('click', function (e) { if (e.target === iosModal) closeIosModal(); });

  // Hide the button once the app is installed.
  window.addEventListener('appinstalled', function () {
    if (container) container.classList.add('hidden');
  });
})();
</script>
