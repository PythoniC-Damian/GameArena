{% if pagination.pages > 1 %}<nav class="ga-pagination" aria-label="Pagination">
{% if pagination.has_prev %}<a class="ga-button ga-button-secondary" href="{{ url_for(request.endpoint, page=pagination.prev_num, game=selected_game|default(''), status=selected_status|default(''), q=search_query|default(''), tournament=selected_tournament_id|default('') or '') }}">Previous</a>{% endif %}
<span>Page {{ pagination.page }} of {{ pagination.pages }}</span>
{% if pagination.has_next %}<a class="ga-button ga-button-secondary" href="{{ url_for(request.endpoint, page=pagination.next_num, game=selected_game|default(''), status=selected_status|default(''), q=search_query|default(''), tournament=selected_tournament_id|default('') or '') }}">Next</a>{% endif %}
</nav>{% endif %}
