<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ code }} · {{ title }} · GameArena</title>
{% include '_pwa_meta.html' %}
{% include '_design_assets.html' %}
</head>
<body class="min-h-screen bg-slate-950 text-white" data-reduce-motion="{{ 'true' if nav_preferences and nav_preferences.reduce_motion else 'false' }}" data-larger-text="{{ 'true' if nav_preferences and nav_preferences.larger_text else 'false' }}">
{% include '_header.html' %}

<main id="main-content" class="mx-auto flex min-h-screen max-w-xl flex-col items-center justify-center px-5 py-16 text-center">
    <p class="text-sm font-semibold uppercase tracking-[0.3em] text-emerald-300">GameArena · {{ code }}</p>
    <h1 class="mt-4 text-3xl font-bold sm:text-4xl">{{ title }}</h1>
    <p class="mt-3 text-slate-400">{{ message }}</p>
    <div class="mt-7 flex flex-wrap justify-center gap-3">
        <a href="{{ url_for('home') }}" class="rounded-xl bg-emerald-500 px-5 py-3 text-sm font-semibold text-slate-950">Home</a>
        {% if current_user.is_authenticated %}<a href="{{ url_for('dashboard') }}" class="rounded-xl border border-slate-700 px-5 py-3 text-sm text-slate-200">Dashboard</a>{% else %}<a href="{{ url_for('login') }}" class="rounded-xl border border-slate-700 px-5 py-3 text-sm text-slate-200">Login</a>{% endif %}
    </div>
</main>
{% include '_pwa_register.html' %}
</body>
</html>
