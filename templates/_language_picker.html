<form method="POST" action="{{ url_for('i18n.choose') }}" class="ga-language-menu"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="next" value="{{ request.full_path }}"><label>{{ t('Language') }} <select name="language">{% for code, name in languages.items() %}<option value="{{ code }}" {% if code == current_language %}selected{% endif %}>{{ name }}</option>{% endfor %}</select></label><noscript><button type="submit">{{ t('Apply') }}</button></noscript></form>
