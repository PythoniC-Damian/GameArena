# Render Blueprint for GameArena
# Existing Supabase PostgreSQL stays external; provide DATABASE_URL as a secret.
# See: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: gamearena
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python scripts/build_styles.py"
    startCommand: "python scripts/migrate.py && python scripts/serve.py --worker-class geventwebsocket.gunicorn.workers.GeventWebSocketWorker -w 1 --timeout 120 --bind 0.0.0.0:$PORT app:app"
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: FLASK_DEBUG
        value: "false"
      # scripts/serve.py patches gevent before imports. Keep this pool small on
      # the 512 MB instance and reuse connections to the external Supabase DB.
      # Set DATABASE_POOL_MODE=null to restore one connection per checkout.
      - key: DATABASE_POOL_MODE
        value: queue
      - key: DATABASE_POOL_SIZE
        value: "3"
      - key: DATABASE_MAX_OVERFLOW
        value: "0"
      - key: SECRET_KEY
        sync: false
      - key: AUTH_PROVIDER
        value: local
      - key: PUBLIC_BASE_URL
        value: https://gamearena01.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      # Paystack Transfers uses the existing PAYSTACK_SECRET_KEY. Configure
      # /paystack/webhook in the Paystack dashboard for transfer events.
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_SERVER
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USE_TLS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false

      # Owner generates these privately; never place values in the repository.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
